services:
  postgres:
    image: postgres:17-alpine
    container_name: gophkeeper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gophkeeper}
      POSTGRES_USER: ${POSTGRES_USER:-gophkeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gophkeeper}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: gophkeeper-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gophkeeper}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gophkeeper-minio-password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: gophkeeper-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gophkeeper}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gophkeeper-minio-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-gophkeeper-blobs}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 1; done;
      mc mb --ignore-existing local/$${MINIO_BUCKET};
      mc anonymous set none local/$${MINIO_BUCKET};
      "

volumes:
  postgres_data:
  minio_data:
